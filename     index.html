<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK8 LIFE OS — Personal Operating System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f4f4f5',
              100: '#e4e4e7',
              400: '#a1a1aa',
              500: '#71717a',
              900: '#18181b',
              950: '#09090b',
            },
            accent: {
              blue: '#3b82f6',
              emerald: '#10b981',
              amber: '#f59e0b',
              violet: '#8b5cf6',
              rose: '#f43f5e',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    .glass-panel {
      background: rgba(18, 18, 21, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glow-subtle {
      box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.12);
    }

    .animate-fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#08080a] text-zinc-200 font-sans antialiased min-h-screen flex flex-col selection:bg-zinc-800 selection:text-white">

  <div id="app" class="flex-1 flex flex-col md:flex-row min-h-screen overflow-hidden">

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 border-r border-zinc-800/60 bg-[#0c0c0e] text-zinc-300 h-screen sticky top-0 z-30 select-none">
      <div class="p-4 border-b border-zinc-800/60 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="h-8 w-8 rounded-lg bg-white text-zinc-950 flex items-center justify-center font-bold text-xs tracking-tighter shadow-sm">
            DK8
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-white tracking-tight text-sm">LIFE OS</span>
            <span class="text-[10px] text-zinc-500 font-mono">Zero-State v3.0</span>
          </div>
        </div>
        <button onclick="openModal('cmd-center-modal')" class="p-1.5 rounded-md hover:bg-zinc-800/60 text-zinc-400 hover:text-white transition" title="Command Center (Cmd+K)">
          <i data-lucide="command" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" id="desktop-nav">
        <!-- Injected dynamically -->
      </nav>

      <!-- Quick Action & System Clock -->
      <div class="p-3 border-t border-zinc-800/60 space-y-2">
        <button onclick="openQuickAddModal()" class="w-full flex items-center justify-center gap-2 py-2 px-3 bg-white text-zinc-950 font-semibold text-xs rounded-lg hover:bg-zinc-200 transition shadow-sm active:scale-[0.98]">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Quick Entry</span>
        </button>
        <div class="flex items-center justify-between px-2 py-1.5 text-[11px] text-zinc-500 font-mono">
          <span class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Active
          </span>
          <span id="time-clock">--:--</span>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative pb-20 md:pb-6">
      <!-- TOP MOBILE BAR -->
      <header class="md:hidden flex items-center justify-between px-4 py-3 bg-[#0c0c0e] border-b border-zinc-800/80 sticky top-0 z-20">
        <div class="flex items-center space-x-2">
          <div class="h-7 w-7 rounded-md bg-white text-zinc-950 flex items-center justify-center font-bold text-xs">
            DK8
          </div>
          <span class="font-bold text-white text-sm">LIFE OS</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="openModal('cmd-center-modal')" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
          <button onclick="openQuickAddModal()" class="p-2 rounded-lg bg-white text-zinc-950">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- TOAST NOTIFICATIONS -->
      <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

      <!-- MAIN PAGE CONTENT -->
      <div id="content-area" class="flex-1">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#0c0c0e]/95 border-t border-zinc-800/80 backdrop-blur-md px-3 py-2 z-40">
      <div class="flex items-center justify-around text-zinc-400" id="mobile-nav">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- COMMAND CENTER MODAL -->
  <div id="cmd-center-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-start justify-center pt-16 md:pt-24 px-4">
    <div class="bg-[#121215] border border-zinc-800 w-full max-w-xl rounded-xl shadow-2xl overflow-hidden animate-fade-in">
      <div class="flex items-center px-4 border-b border-zinc-800">
        <i data-lucide="search" class="w-4 h-4 text-zinc-400 mr-3"></i>
        <input id="cmd-input" type="text" placeholder="Type command or jump to module (e.g. 'Gym', 'University', 'Add Course')..." 
               class="w-full bg-transparent py-3.5 text-sm text-white placeholder-zinc-500 focus:outline-none"
               oninput="filterCommandCenter(this.value)">
        <span class="text-[10px] font-mono bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded border border-zinc-700/50">ESC</span>
      </div>
      <div id="cmd-results" class="p-2 max-h-80 overflow-y-auto space-y-1">
        <!-- Command options dynamically rendered -->
      </div>
    </div>
  </div>

  <!-- UNIVERSAL QUICK ADD / FORM MODAL -->
  <div id="quick-add-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#121215] border border-zinc-800 w-full max-w-md rounded-xl p-5 shadow-2xl space-y-4 animate-fade-in max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <h3 id="form-modal-title" class="text-sm font-semibold text-white flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> New Entry
        </h3>
        <button onclick="closeModal('quick-add-modal')" class="text-zinc-500 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="universal-form" onsubmit="handleUniversalSubmit(event)" class="space-y-3">
        <input type="hidden" id="form-edit-id" value="">
        <div>
          <label class="text-[11px] font-medium text-zinc-400 block mb-1">Entry Type</label>
          <select id="form-entry-type" onchange="renderFormFields(this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-zinc-600">
            <option value="course">University Course</option>
            <option value="assignment">Assignment / Exam</option>
            <option value="study">Study Session</option>
            <option value="workout">Workout Routine</option>
            <option value="meal">Nutrition Log</option>
            <option value="sleep">Sleep Record</option>
            <option value="event">Schedule Event</option>
            <option value="project">Work Project</option>
            <option value="skill">Skill Goal</option>
            <option value="note">Note / Attachment</option>
          </select>
        </div>

        <div id="form-dynamic-fields" class="space-y-3">
          <!-- Dynamic form fields -->
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('quick-add-modal')" class="px-3 py-1.5 rounded-lg border border-zinc-800 text-xs font-medium text-zinc-400 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-1.5 rounded-lg bg-white text-zinc-950 text-xs font-semibold hover:bg-zinc-200 transition">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SAFE DELETE CONFIRMATION MODAL -->
  <div id="safe-delete-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#121215] border border-rose-900/40 w-full max-w-sm rounded-xl p-5 shadow-2xl space-y-4 animate-fade-in">
      <div class="flex items-center gap-3 text-rose-400">
        <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0"></i>
        <h3 class="text-sm font-bold text-white">Confirm Deletion</h3>
      </div>
      
      <p id="safe-delete-text" class="text-xs text-zinc-400 leading-relaxed">
        Are you sure you want to delete this item? This action cannot be undone.
      </p>

      <div id="safe-delete-cascade" class="p-2.5 bg-rose-950/20 border border-rose-900/30 rounded-lg text-[11px] text-rose-300/80 hidden">
        <!-- Cascade warning details -->
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal('safe-delete-modal')" class="px-3 py-1.5 rounded-lg border border-zinc-800 text-xs font-medium text-zinc-400 hover:text-white">Cancel</button>
        <button id="safe-delete-confirm-btn" class="px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold transition">Delete Permanently</button>
      </div>
    </div>
  </div>

  <script>
    // STRICT ZERO-STATE INITIAL SCHEMA
    const ZERO_STATE = {
      profile: {
        name: "",
        university: "",
        academicYear: "",
        sleepTarget: 8.0,
        calorieTarget: 2500,
        proteinTarget: 150,
        waterTarget: 3.0,
        units: "Metric (kg, km)",
        weekStart: "Monday"
      },
      courses: [],
      assignments: [],
      studySessions: [],
      workouts: [],
      nutrition: [],
      sleepLogs: [],
      events: [],
      workProjects: [],
      skills: [],
      notes: [],
      files: []
    };

    // Load state or reset to pure zero-state
    let state = loadState();

    function loadState() {
      const stored = localStorage.getItem('DK8_LIFE_OS_DATA');
      if (!stored) return JSON.parse(JSON.stringify(ZERO_STATE));
      try {
        const parsed = JSON.parse(stored);
        // Ensure all keys exist
        Object.keys(ZERO_STATE).forEach(key => {
          if (!(key in parsed)) parsed[key] = ZERO_STATE[key];
        });
        return parsed;
      } catch (e) {
        return JSON.parse(JSON.stringify(ZERO_STATE));
      }
    }

    function saveState() {
      localStorage.setItem('DK8_LIFE_OS_DATA', JSON.stringify(state));
    }

    function resetAllDataToZero() {
      state = JSON.parse(JSON.stringify(ZERO_STATE));
      saveState();
      renderContent();
      showToast("System reset to complete ZERO STATE.");
    }

    const NAV_ITEMS = [
      { id: "overview", label: "Overview", icon: "layout-dashboard" },
      { id: "university", label: "University", icon: "graduation-cap" },
      { id: "study", label: "Study System", icon: "book-open" },
      { id: "gym", label: "Gym & Workout", icon: "dumbbell" },
      { id: "schedule", label: "Schedule", icon: "calendar" },
      { id: "work", label: "Work Projects", icon: "briefcase" },
      { id: "health", label: "Sleep & Nutrition", icon: "moon" },
      { id: "skills", label: "Skills", icon: "zap" },
      { id: "analytics", label: "Analytics", icon: "bar-chart-3" },
      { id: "files", label: "File Vault", icon: "folder-archive" },
      { id: "settings", label: "Settings", icon: "settings" }
    ];

    let currentTab = "overview";

    function initNav() {
      const desktopNav = document.getElementById('desktop-nav');
      const mobileNav = document.getElementById('mobile-nav');

      desktopNav.innerHTML = NAV_ITEMS.map(item => `
        <button onclick="switchTab('${item.id}')" 
                class="w-full flex items-center px-3 py-2 text-xs font-medium rounded-lg transition-all duration-150 ${
                  currentTab === item.id 
                    ? 'bg-zinc-800/90 text-white shadow-sm border border-zinc-700/60 font-semibold' 
                    : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/60'
                }">
          <i data-lucide="${item.icon}" class="w-4 h-4 mr-3 stroke-[1.75]"></i>
          <span>${item.label}</span>
        </button>
      `).join('');

      const mobileItems = NAV_ITEMS.slice(0, 4);
      mobileNav.innerHTML = mobileItems.map(item => `
        <button onclick="switchTab('${item.id}')" class="flex flex-col items-center py-1 ${currentTab === item.id ? 'text-white font-semibold' : 'text-zinc-400'}">
          <i data-lucide="${item.icon}" class="w-5 h-5"></i>
          <span class="text-[10px] mt-1">${item.label.split(' ')[0]}</span>
        </button>
      `).join('') + `
        <button onclick="openModal('cmd-center-modal')" class="flex flex-col items-center py-1 text-zinc-400">
          <i data-lucide="menu" class="w-5 h-5"></i>
          <span class="text-[10px] mt-1">Menu</span>
        </button>
      `;

      lucide.createIcons();
    }

    function switchTab(tabId) {
      currentTab = tabId;
      initNav();
      renderContent();
    }

    function renderContent() {
      const content = document.getElementById('content-area');
      content.className = "flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full animate-fade-in space-y-6";

      switch (currentTab) {
        case "overview": content.innerHTML = renderOverviewTab(); break;
        case "university": content.innerHTML = renderUniversityTab(); break;
        case "study": content.innerHTML = renderStudyTab(); break;
        case "gym": content.innerHTML = renderGymTab(); break;
        case "schedule": content.innerHTML = renderScheduleTab(); break;
        case "work": content.innerHTML = renderWorkTab(); break;
        case "health": content.innerHTML = renderHealthTab(); break;
        case "skills": content.innerHTML = renderSkillsTab(); break;
        case "analytics": content.innerHTML = renderAnalyticsTab(); break;
        case "files": content.innerHTML = renderFilesTab(); break;
        case "settings": content.innerHTML = renderSettingsTab(); break;
        default: content.innerHTML = renderOverviewTab();
      }

      lucide.createIcons();
    }

    // --- 1. OVERVIEW VIEW ---
    function renderOverviewTab() {
      const nameDisplay = state.profile.name || "User";
      const uniDisplay = state.profile.university ? `${state.profile.university} ${state.profile.academicYear ? '• ' + state.profile.academicYear : ''}` : "Configure profile in Settings";

      const totalAssignments = state.assignments.length;
      const completedAssignments = state.assignments.filter(a => a.completed).length;
      const totalWorkouts = state.workouts.length;
      const totalSleepLogs = state.sleepLogs.length;

      return `
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-zinc-800/60 pb-5">
          <div>
            <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Welcome, ${nameDisplay}</h1>
            <p class="text-xs text-zinc-400 mt-1 font-mono">${uniDisplay}</p>
          </div>
          <div class="flex items-center space-x-2 bg-zinc-900/90 border border-zinc-800 px-3 py-1.5 rounded-lg self-start md:self-auto">
            <span class="w-2 h-2 rounded-full ${state.courses.length || state.workouts.length ? 'bg-emerald-400' : 'bg-amber-400'} animate-pulse"></span>
            <span class="text-xs font-mono text-zinc-300">OS State: ${state.courses.length || state.workouts.length ? 'Active' : 'Zero State'}</span>
          </div>
        </div>

        <!-- DYNAMIC TODAY MODE / ACTION CENTER -->
        <div class="bg-[#121215] border border-zinc-800/90 rounded-xl p-5 glow-subtle">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center space-x-2">
              <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i>
              <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-300">Schedule Engine & Today Overview</h2>
            </div>
            <button onclick="openQuickAddModal('event')" class="text-xs text-blue-400 hover:underline font-medium">+ Add Event</button>
          </div>

          ${state.events.length === 0 ? `
            <div class="text-center py-8 border border-dashed border-zinc-800 rounded-lg">
              <p class="text-xs text-zinc-400 font-medium">No schedule configured for today</p>
              <p class="text-[11px] text-zinc-600 mt-1">Add your lectures, work blocks, or workout sessions to activate Today Mode.</p>
              <button onclick="openQuickAddModal('event')" class="mt-3 px-3 py-1.5 bg-white text-zinc-950 rounded-lg text-xs font-semibold hover:bg-zinc-200 transition">
                + Configure Schedule
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${state.events.map(e => `
                <div class="bg-zinc-950 border border-zinc-800 p-3.5 rounded-lg flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-mono text-blue-400">${e.time || 'All Day'}</span>
                    <h3 class="text-xs font-semibold text-white mt-0.5">${e.title}</h3>
                    <span class="text-[10px] text-zinc-500">${e.category || 'General'}</span>
                  </div>
                  <button onclick="triggerSafeDelete('event', '${e.id}', '${e.title}')" class="text-zinc-600 hover:text-rose-400 p-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- REAL DYNAMIC METRICS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-[#121215] border border-zinc-800/80 p-4 rounded-xl flex justify-between items-start">
            <div>
              <p class="text-[11px] text-zinc-400 font-medium">Assignments</p>
              <p class="text-xl font-bold text-white mt-1">${completedAssignments} / ${totalAssignments}</p>
              <p class="text-[10px] text-zinc-500 mt-1 font-mono">${totalAssignments ? Math.round((completedAssignments/totalAssignments)*100)+'%' : 'No tasks'}</p>
            </div>
            <i data-lucide="graduation-cap" class="w-5 h-5 text-blue-400"></i>
          </div>

          <div class="bg-[#121215] border border-zinc-800/80 p-4 rounded-xl flex justify-between items-start">
            <div>
              <p class="text-[11px] text-zinc-400 font-medium">Workouts Logged</p>
              <p class="text-xl font-bold text-white mt-1">${totalWorkouts}</p>
              <p class="text-[10px] text-zinc-500 mt-1 font-mono">Real entries</p>
            </div>
            <i data-lucide="dumbbell" class="w-5 h-5 text-emerald-400"></i>
          </div>

          <div class="bg-[#121215] border border-zinc-800/80 p-4 rounded-xl flex justify-between items-start">
            <div>
              <p class="text-[11px] text-zinc-400 font-medium">Sleep Records</p>
              <p class="text-xl font-bold text-white mt-1">${totalSleepLogs}</p>
              <p class="text-[10px] text-zinc-500 mt-1 font-mono">Logged sessions</p>
            </div>
            <i data-lucide="moon" class="w-5 h-5 text-violet-400"></i>
          </div>

          <div class="bg-[#121215] border border-zinc-800/80 p-4 rounded-xl flex justify-between items-start">
            <div>
              <p class="text-[11px] text-zinc-400 font-medium">Work Projects</p>
              <p class="text-xl font-bold text-white mt-1">${state.workProjects.length}</p>
              <p class="text-[10px] text-zinc-500 mt-1 font-mono">Active projects</p>
            </div>
            <i data-lucide="briefcase" class="w-5 h-5 text-amber-400"></i>
          </div>
        </div>
      `;
    }

    // --- 2. UNIVERSITY VIEW ---
    function renderUniversityTab() {
      return `
        <div class="flex items-center justify-between border-b border-zinc-800/60 pb-4">
          <div>
            <h1 class="text-xl font-bold text-white">University Module</h1>
            <p class="text-xs text-zinc-400 mt-1">Academics, Courses, Assignments & Exams</p>
          </div>
          <div class="flex gap-2">
            <button onclick="openQuickAddModal('assignment')" class="px-3 py-1.5 bg-zinc-800 text-white hover:bg-zinc-700 text-xs font-medium rounded-lg">
              + Add Assignment
            </button>
            <button onclick="openQuickAddModal('course')" class="px-3 py-1.5 bg-white text-zinc-950 font-semibold text-xs rounded-lg hover:bg-zinc-200">
              + Add Course
            </button>
          </div>
        </div>

        <!-- COURSES SECTION -->
        <div class="space-y-3">
          <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Courses</h2>
          ${state.courses.length === 0 ? `
            <div class="bg-[#121215] border border-zinc-800 rounded-xl p-8 text-center space-y-3">
              <i data-lucide="graduation-cap" class="w-8 h-8 text-zinc-600 mx-auto"></i>
              <h3 class="text-sm font-bold text-white">No courses yet</h3>
              <p class="text-xs text-zinc-400 max-w-sm mx-auto">Add your first course to start tracking lectures, assignments, and academic progress.</p>
              <button onclick="openQuickAddModal('course')" class="px-4 py-2 bg-white text-zinc-950 font-semibold text-xs rounded-lg hover:bg-zinc-200 transition">
                + Add Course
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${state.courses.map(c => `
                <div class="bg-[#121215] border border-zinc-800 p-4 rounded-xl space-y-3 relative">
                  <div class="flex justify-between items-start">
                    <div>
                      <span class="text-[10px] font-mono text-blue-400">${c.code || 'COURSE'}</span>
                      <h3 class="text-sm font-bold text-white">${c.title}</h3>
                    </div>
                    <div class="flex items-center gap-1">

    function openQuickAddModal(type = 'course') {
      const modal = document.getElementById('quick-add-modal');
      const select = document.getElementById('form-entry-type');
      select.value = type;
      renderFormFields(type);
      modal.classList.remove('hidden');
    }

    function renderFormFields(type) {
      const container = document.getElementById('form-dynamic-fields');
      let html = '';

      switch (type) {
        case 'course':
          html = `
            <input id="f-title" type="text" required placeholder="Course Title (e.g. Calculus III)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-code" type="text" placeholder="Course Code (e.g. ENG-301)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-instructor" type="text" placeholder="Instructor Name" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
          `;
          break;
        case 'assignment':
          html = `
            <input id="f-title" type="text" required placeholder="Assignment / Exam Title" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-course" type="text" placeholder="Course Code/Name" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-due" type="text" placeholder="Due Date (e.g. Oct 12, 23:59)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
          `;
          break;
        case 'workout':
          html = `
            <input id="f-title" type="text" required placeholder="Routine Name (e.g. Push Workout)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-exercise" type="text" placeholder="Main Exercise (e.g. Bench Press)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <div class="grid grid-cols-2 gap-2">
              <input id="f-weight" type="number" placeholder="Weight (kg)" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
              <input id="f-reps" type="number" placeholder="Reps" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            </div>
          `;
          break;
        case 'study':
          html = `
            <input id="f-subject" type="text" required placeholder="Subject or Topic" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-duration" type="number" placeholder="Duration (Minutes)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
          `;
          break;
        case 'meal':
          html = `
            <input id="f-name" type="text" required placeholder="Meal Name (e.g. Chicken & Rice)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <div class="grid grid-cols-2 gap-2">
              <input id="f-calories" type="number" placeholder="Calories (kcal)" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
              <input id="f-protein" type="number" placeholder="Protein (g)" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            </div>
          `;
          break;
        case 'sleep':
          html = `
            <input id="f-hours" type="number" step="0.1" required placeholder="Hours Slept (e.g. 7.5)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
          `;
          break;
        case 'event':
          html = `
            <input id="f-title" type="text" required placeholder="Event Title" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-time" type="text" placeholder="Time Slot (e.g. 09:00 - 11:00)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-category" type="text" placeholder="Category (e.g. University, Gym)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
          `;
          break;
        case 'project':
          html = `
            <input id="f-title" type="text" required placeholder="Project Title" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-desc" type="text" placeholder="Description / Goal" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
          `;
          break;
        case 'skill':
          html = `
            <input id="f-name" type="text" required placeholder="Skill Name" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <input id="f-level" type="text" placeholder="Target Level (e.g. Advanced)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
          `;
          break;
        case 'note':
          html = `
            <input id="f-filename" type="text" required placeholder="File / Note Title" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white">
            <div class="p-4 border-2 border-dashed border-zinc-800 rounded-lg text-center text-xs text-zinc-500">
              Drag & Drop file here or click to browse
            </div>
          `;
          break;
      }

      container.innerHTML = html;
    }

    function handleUniversalSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('form-entry-type').value;
      const id = 'id_' + Date.now();

      if (type === 'course') {
        state.courses.push({
          id,
          title: document.getElementById('f-title').value,
          code: document.getElementById('f-code').value,
          instructor: document.getElementById('f-instructor').value
        });
      } else if (type === 'assignment') {
        state.assignments.push({
          id,
          title: document.getElementById('f-title').value,
          course: document.getElementById('f-course').value,
          due: document.getElementById('f-due').value,
          completed: false
        });
      } else if (type === 'workout') {
        state.workouts.push({
          id,
          name: document.getElementById('f-title').value,
          exercise: document.getElementById('f-exercise').value,
          weight: document.getElementById('f-weight').value || 0,
          reps: document.getElementById('f-reps').value || 0
        });
      } else if (type === 'study') {
        state.studySessions.push({
          id,
          subject: document.getElementById('f-subject').value,
          duration: document.getElementById('f-duration').value || 30
        });
      } else if (type === 'meal') {
        state.nutrition.push({
          id,
          name: document.getElementById('f-name').value,
          calories: document.getElementById('f-calories').value || 0,
          protein: document.getElementById('f-protein').value || 0
        });
      } else if (type === 'sleep') {
        state.sleepLogs.push({
          id,
          hours: document.getElementById('f-hours').value
        });
      } else if (type === 'event') {
        state.events.push({
          id,
          title: document.getElementById('f-title').value,
          time: document.getElementById('f-time').value,
          category: document.getElementById('f-category').value
        });
      } else if (type === 'project') {
        state.workProjects.push({
          id,
          title: document.getElementById('f-title').value,
          description: document.getElementById('f-desc').value,
          status: 'Active'
        });
      } else if (type === 'skill') {
        state.skills.push({
          id,
          name: document.getElementById('f-name').value,
          level: document.getElementById('f-level').value
        });
      } else if (type === 'note') {
        state.files.push({
          id,
          name: document.getElementById('f-filename').value,
          size: '1.4 MB',
          type: 'PDF Document'
        });
      }

      saveState();
      closeModal('quick-add-modal');
      renderContent();
      showToast('Entry successfully added.');
    }

    let itemToDelete = null;

    function triggerSafeDelete(category, id, title) {
      itemToDelete = { category, id, title };
      const modal = document.getElementById('safe-delete-modal');
      const text = document.getElementById('safe-delete-text');
      const cascade = document.getElementById('safe-delete-cascade');

      text.innerHTML = `Are you sure you want to delete <strong class="text-white">"${title}"</strong>? This action cannot be undone.`;

      if (category === 'course') {
        const related = state.assignments.filter(a => a.course && a.course.toLowerCase().includes(title.toLowerCase()));
        if (related.length > 0) {
          cascade.classList.remove('hidden');
          cascade.innerHTML = `Warning: Deleting this course will also remove ${related.length} related assignment(s).`;
        } else {
          cascade.classList.add('hidden');
        }
      } else {
        cascade.classList.add('hidden');
      }

      document.getElementById('safe-delete-confirm-btn').onclick = executeDelete;
      modal.classList.remove('hidden');
    }

    function executeDelete() {
      if (!itemToDelete) return;
      const { category, id, title } = itemToDelete;

      if (category === 'course') {
        state.courses = state.courses.filter(i => i.id !== id);
        state.assignments = state.assignments.filter(a => !(a.course && a.course.toLowerCase().includes(title.toLowerCase())));
      } else if (category === 'assignment') {
        state.assignments = state.assignments.filter(i => i.id !== id);
      } else if (category === 'study') {
        state.studySessions = state.studySessions.filter(i => i.id !== id);
      } else if (category === 'workout') {
        state.workouts = state.workouts.filter(i => i.id !== id);
      } else if (category === 'meal') {
        state.nutrition = state.nutrition.filter(i => i.id !== id);
      } else if (category === 'sleep') {
        state.sleepLogs = state.sleepLogs.filter(i => i.id !== id);
      } else if (category === 'event') {
        state.events = state.events.filter(i => i.id !== id);
      } else if (category === 'project') {
        state.workProjects = state.workProjects.filter(i => i.id !== id);
      } else if (category === 'skill') {
        state.skills = state.skills.filter(i => i.id !== id);
      } else if (category === 'file') {
        state.files = state.files.filter(i => i.id !== id);
      }

      saveState();
      closeModal('safe-delete-modal');
      renderContent();
      showToast(`Deleted "${title}" permanently.`);
    }

    function toggleAssignmentDone(id) {
      const item = state.assignments.find(a => a.id === id);
      if (item) {
        item.completed = !item.completed;
        saveState();
        renderContent();
      }
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-zinc-900 border border-zinc-700 text-white text-xs px-4 py-2.5 rounded-lg shadow-xl animate-fade-in pointer-events-auto flex items-center space-x-2';
      toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function updateClock() {
      const clock = document.getElementById('time-clock');
      if (clock) {
        const now = new Date();
        clock.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

    window.onload = function() {
      initNav();
      renderContent();
      setInterval(updateClock, 1000);
      updateClock();
    };
  </script>
</body>
</html>
